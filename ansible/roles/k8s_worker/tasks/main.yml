---
- name: Настройка и подключение Kubernetes Worker
  block:
    - name: Отключение SWAP
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Удаление SWAP из /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*)([^#\n]+\s+swap\s+.*)$'
        replace: '# \1\2'

    - name: Загрузка модулей ядра для сети контейнеров
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Сохранение модулей ядра при перезагрузке
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Настройка sysctl параметров для Kubernetes и сети
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/k8s.conf
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }

    - name: Подключение репозитория Kubernetes
      ansible.builtin.apt_repository:
        repo: "deb [trusted=yes] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present
        filename: kubernetes
        update_cache: true
      register: apt_repo_result
      retries: 3
      delay: 10
      until: apt_repo_result is succeeded

    - name: Установка CRI (containerd), kubeadm и kubelet
      ansible.builtin.apt:
        name:
          - containerd
          - kubelet
          - kubeadm
        state: present
        update_cache: true
        cache_valid_time: 3600
      register: apt_install_result
      retries: 3
      delay: 15
      until: apt_install_result is succeeded
      timeout: 300

    - name: Фиксация версий пакетов Kubernetes (hold)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm

    - name: Создание каталога конфигурации containerd
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Генерация полной конфигурации containerd по умолчанию
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Включение SystemdCgroup в containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Применение настроек и перезапуск containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Включение автозапуска kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: Подключение Worker к кластеру через join-команду
      ansible.builtin.command: "{{ hostvars[groups['master'][0]]['k8s_join_command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      register: join_result
      retries: 3
      delay: 30
      until: join_result.rc == 0
      timeout: 300

  rescue:
    - name: Запись сбоя настройки Worker в install_errors.log
      ansible.builtin.lineinfile:
        path: "{{ tools_error_log | default(playbook_dir ~ '/install_errors.log') }}"
        create: true
        line: |
          ------------------------------------------------------------
          [ВРЕМЯ]: {{ '%Y-%m-%d %H:%M:%S' | strftime }}
          [ХОСТ]: {{ inventory_hostname }} ({{ ansible_host | default('no-ip') }})
          [ШАГ]: k8s_worker -> {{ ansible_failed_task.name }}
          [СООБЩЕНИЕ]: {{ ansible_failed_result.msg | default('Нет описания msg') }}
          [STDERR]: {{ ansible_failed_result.stderr | default(ansible_failed_result.module_stderr | default('Пусто')) }}
          [КОМАНДА]: {{ ansible_failed_result.cmd | default('Н/Д') }}
          ------------------------------------------------------------
      delegate_to: localhost
      become: false

    - name: Прерывание роли k8s_worker из-за критической ошибки
      ansible.builtin.fail:
        msg: "Сбой на шаге '{{ ansible_failed_task.name }}'. Ошибка сохранена в ansible/install_errors.log"
