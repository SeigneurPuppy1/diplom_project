---
- name: Развертывание Kubernetes Master
  block:
    - name: Отключение SWAP
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Удаление SWAP из /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*)([^#\n]+\s+swap\s+.*)$'
        replace: '# \1\2'

    - name: Загрузка модулей ядра для сети контейнеров
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Сохранение модулей ядра при перезагрузке
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Настройка sysctl параметров для Kubernetes и Flannel
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/k8s.conf
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }

    - name: Подключение репозитория Kubernetes
      ansible.builtin.apt_repository:
        repo: "deb [trusted=yes] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present
        filename: kubernetes
        update_cache: true
      retries: 3
      delay: 10
      until: apt_repo_result is succeeded
      register: apt_repo_result

    - name: Установка CRI (containerd), kubeadm, kubelet, kubectl
      ansible.builtin.apt:
        name:
          - containerd
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true
        cache_valid_time: 3600
      register: apt_install_result
      retries: 3
      delay: 15
      until: apt_install_result is succeeded
      timeout: 300  # 5 минут на установку

    - name: Фиксация версий пакетов Kubernetes (hold)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Создание каталога конфигурации containerd
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Генерация полной конфигурации containerd по умолчанию
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Включение SystemdCgroup в containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Применение настроек и перезапуск containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Включение автозапуска kubelet (без старта до kubeadm)
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: Включение и запуск kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started
        daemon_reload: true
      ignore_errors: true

    - name: Ожидание, пока kubelet не станет активным (до 30 секунд)
      ansible.builtin.shell: |
        for i in {1..10}; do
          if systemctl is-active --quiet kubelet; then
            echo "kubelet is running"
            exit 0
          fi
          sleep 3
        done
        echo "kubelet not active, but kubeadm will handle it"
        exit 0
      changed_when: false

    - name: Очистка предыдущего состояния kubeadm
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/cni
        - /var/lib/etcd
      ignore_errors: true

    - name: Инициализация кластера Kubernetes через kubeadm
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
        --apiserver-cert-extra-sans={{ ansible_host | default(ansible_default_ipv4.address) }}
        --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init
      retries: 2
      delay: 30
      until: kubeadm_init.rc == 0
      timeout: 600

    - name: Создание каталога ~/.kube для текущего пользователя
      ansible.builtin.file:
        path: "/home/{{ ansible_user | default('ubuntu') }}/.kube"
        state: directory
        owner: "{{ ansible_user | default('ubuntu') }}"
        group: "{{ ansible_user | default('ubuntu') }}"
        mode: '0755'

    - name: Копирование admin.conf в домашний каталог пользователя
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user | default('ubuntu') }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user | default('ubuntu') }}"
        group: "{{ ansible_user | default('ubuntu') }}"
        mode: '0600'

    - name: Ожидание доступности порта kube-apiserver
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 6443
        delay: 10
        timeout: 300

    - name: Ожидание готовности kube-apiserver к приёму запросов
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: apiserver_ready
      until: apiserver_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      timeout: 300

    - name: Установка сетевого плагина Flannel CNI
      ansible.builtin.command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false
      register: flannel_apply
      retries: 3
      delay: 10
      until: flannel_apply.rc == 0
      timeout: 120

    - name: Получение команды join для подключения воркеров
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: Сохранение команды join в facts группы
      ansible.builtin.set_fact:
        k8s_join_command: "{{ join_command_raw.stdout }}"

    - name: Скачивание admin.conf на управляющий хост для передачи в Jenkins
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: /tmp/kubeconfig_master
        flat: true
      become: true

  rescue:
    - name: Запись сбоя настройки Master в install_errors.log
      ansible.builtin.lineinfile:
        path: "{{ tools_error_log | default(playbook_dir ~ '/install_errors.log') }}"
        create: true
        line: |
          ------------------------------------------------------------
          [ВРЕМЯ]: {{ '%Y-%m-%d %H:%M:%S' | strftime }}
          [ХОСТ]: {{ inventory_hostname }} ({{ ansible_host | default('no-ip') }})
          [ШАГ]: k8s_master -> {{ ansible_failed_task.name }}
          [СООБЩЕНИЕ]: {{ ansible_failed_result.msg | default('Нет описания msg') }}
          [STDERR]: {{ ansible_failed_result.stderr | default(ansible_failed_result.module_stderr | default('Пусто')) }}
          [КОМАНДА]: {{ ansible_failed_result.cmd | default('Н/Д') }}
          ------------------------------------------------------------
      delegate_to: localhost
      become: false

    - name: Прерывание роли k8s_master из-за критической ошибки
      ansible.builtin.fail:
        msg: "Сбой на шаге '{{ ansible_failed_task.name }}'. Ошибка сохранена в ansible/install_errors.log"
